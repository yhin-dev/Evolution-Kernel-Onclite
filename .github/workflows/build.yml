name: Build Evolution Kernel (Onclite A13-A17)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc cpio flex bison libssl-dev \
            libelf-dev dwarves zip curl git python3 rsync jq ccache lz4

      - name: Clone Kernel Source & Toolchain
        run: |
          URL_KERNEL=$(printf '%s%s' 'https://codeberg.org' 'hadad/android_kernel_xiaomi_onclite.git')
          URL_CLANG=$(printf '%s%s' 'https://googlesource.com' 'platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r536225.tar.gz')
          git clone --depth=1 "$URL_KERNEL" kernel_src
          mkdir -p clang
          curl -sL "$URL_CLANG" | tar -xz -C clang

      - name: Integrate KernelSU-Next, SuSFS & NoMount
        working-directory: kernel_src
        run: |
          URL_KSU=$(echo "aHR0cHM6Ly9naXRodWIuY29tL0tlcm5lbFNVLU5leHQvS2VybmVsU1UtTmV4dC5naXQ=" | base64 -d)
          URL_SUSFS=$(echo "aHR0cHM6Ly9naXRodWIuY29tL0phY2tBMWx0bWFuL05vbkdLSV9LZXJuZWxfQnVpbGRfMm5kLmdpdA==" | base64 -d)
          URL_NOMOUNT=$(echo "aHR0cHM6Ly9naXRodWIuY29tL21heHN0ZWVlbC9ub21vdW50LmdpdA==" | base64 -d)

          # 1. KernelSU-Next
          git clone --depth=1 "$URL_KSU" KernelSU-Next
          bash KernelSU-Next/kernel/setup.sh

          # 2. SuSFS (JackA1ltman 4.9 Backport)
          git clone --depth=1 "$URL_SUSFS" susfs
          patch -p1 --fuzz=3 < susfs/Patches/Patch/susfs_patch_to_4.9.patch || true
          find . -name "*.rej" -delete
          bash susfs/Patches/susfs_inline_hook_patches.sh

          # 3. NoMount + Fix 4.9 Backported VFS
          git clone --depth=1 "$URL_NOMOUNT" nomount_src
          bash nomount_src/kernel/setup.sh
          sed -i 's/vfs_getattr_nosec(&info->r_path, stat)/vfs_getattr_nosec(\&info->r_path, stat, STATX_BASIC_STATS, AT_STATX_SYNC_AS_STAT)/g' fs/nomount/nomount.c
          sed -i 's/int nm_getattr(struct vfsmount \*mnt, struct dentry \*dentry, struct kstat \*stat)/int nm_getattr(const struct path *path, struct kstat *stat, u32 request_mask, unsigned int flags)/g' fs/nomount/nomount.c
          sed -i '/int nm_getattr(const struct path \*path/,/{/ s/{/{\n\tstruct dentry *dentry = path->dentry;/' fs/nomount/nomount.c

      - name: Apply Evolution Kernel Tuning & Compile
        working-directory: kernel_src
        run: |
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Evolution"
          export KBUILD_BUILD_HOST="Onclite-A13-A17"

          DEFCONFIG_PATH=$(find arch/arm64/configs -name "*onclite*defconfig" | head -n 1)
          DEFCONFIG_NAME=${DEFCONFIG_PATH#arch/arm64/configs/}
          echo "Menggunakan defconfig: $DEFCONFIG_NAME"

          sed -i 's/CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-Evolution-Kernel"/' "$DEFCONFIG_PATH"

          cat << 'EOF' >> "$DEFCONFIG_PATH"
          CONFIG_KSU=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_NOMOUNT=y
          CONFIG_CPU_FREQ_DEFAULT_GOV_SCHEDUTIL=y
          CONFIG_TCP_CONG_ADVANCED=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_DEFAULT_BBR=y
          CONFIG_DEFAULT_TCP_CONG="bbr"
          CONFIG_HZ_300=y
          EOF

          make O=out "$DEFCONFIG_NAME"
          make -j$(nproc) O=out \
            CC="ccache clang" \
            HOSTCC=gcc \
            HOSTCXX=g++ \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            Image.gz-dtb

      - name: Package AnyKernel3 Zip
        run: |
          URL_AK3=$(echo "aHR0cHM6Ly9naXRodWIuY29tL29zbTBzaXMvQW55S2VybmVsMy5naXQ=" | base64 -d)
          git clone --depth=1 "$URL_AK3" AnyKernel3
          cp kernel_src/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/

          sed -i 's/kernel.string=.*/kernel.string=Evolution Kernel [A13-A17] by yhin-dev/' AnyKernel3/anykernel.sh
          sed -i 's/device.name1=.*/device.name1=onclite/' AnyKernel3/anykernel.sh
          sed -i 's/device.name2=.*/device.name2=onc/' AnyKernel3/anykernel.sh
          sed -i 's/do.devicecheck=.*/do.devicecheck=1/' AnyKernel3/anykernel.sh
          sed -i 's/supported.versions=.*/supported.versions=/' AnyKernel3/anykernel.sh

          cd AnyKernel3
          zip -r9 "$GITHUB_WORKSPACE/Evolution-Kernel-onclite-A13-A17-$(date +%Y%m%d).zip" * -x .git README.md *placeholder

      - name: Upload Evolution Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Evolution-Kernel-Onclite
          path: Evolution-Kernel-onclite-*.zip
